name: deploy-hostgator

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.HOSTGATOR_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install PHP build dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts --no-progress

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build production assets
        run: |
          npm ci
          npm run build
          tar -czf deploy-assets.tar.gz -C public build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTGATOR_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_hostgator"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_hostgator" "$HOME/.ssh/known_hosts"

      - name: Upload production assets
        env:
          SSH_HOST: ${{ secrets.HOSTGATOR_SSH_HOST }}
        run: |
          test -n "$SSH_HOST"
          scp -P 2222 -i "$HOME/.ssh/id_hostgator" \
            deploy-assets.tar.gz \
            "lukasm44@$SSH_HOST:/home1/lukasm44/repositories/hub-inovaforce/storage/app/deploy-assets.tar.gz"

      - name: Deploy application
        env:
          SSH_HOST: ${{ secrets.HOSTGATOR_SSH_HOST }}
        run: |
          ssh -p 2222 -i "$HOME/.ssh/id_hostgator" "lukasm44@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          APP_PATH=/home1/lukasm44/repositories/hub-inovaforce
          PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php

          cd "$APP_PATH"
          test -f .env
          test -x "$PHP_BIN"

          "$PHP_BIN" artisan down --retry=60 || true
          trap '"$PHP_BIN" artisan up || true' EXIT

          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          elif [ -f "$HOME/composer.phar" ]; then
              "$PHP_BIN" "$HOME/composer.phar" install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          elif [ -f "$HOME/bin/composer.phar" ]; then
              "$PHP_BIN" "$HOME/bin/composer.phar" install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          else
              echo "Composer nao encontrado na hospedagem."
              exit 1
          fi

          tar -xzf storage/app/deploy-assets.tar.gz -C public
          "$PHP_BIN" artisan migrate --force
          "$PHP_BIN" artisan storage:link || true
          "$PHP_BIN" artisan optimize:clear
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan view:cache
          "$PHP_BIN" artisan queue:restart
          "$PHP_BIN" artisan up
          trap - EXIT
          REMOTE
